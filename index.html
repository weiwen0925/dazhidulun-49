*{box-sizing:border-box;margin:0;padding:0;}

a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--gold);}

.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:6px 0;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:5px 4px;width:100%;cursor:pointer;
  text-decoration:none;color:var(--sbText);
  transition:all .25s;border-radius:6px;}
.sb-item:hover{background:rgba(184,134,11,.18);color:var(--goldL);}
.sb-item.active{background:rgba(184,134,11,.22);color:var(--goldL);}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;
  box-shadow:0 0 12px rgba(212,168,75,.45);}
.sb-circle{width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(212,196,168,.1);color:var(--sbText);
  font-family:"Noto Sans TC",sans-serif;font-weight:600;font-size:15px;
  border:1px solid rgba(212,196,168,.25);transition:all .25s;}
.sb-label{font-size:11.5px;letter-spacing:1.5px;font-family:"Noto Sans TC",sans-serif;
  text-align:center;line-height:1.2;}

#sbToggle{display:none;position:fixed;left:14px;top:14px;z-index:130;
  background:var(--sbBg);color:var(--gold);border:none;
  width:42px;height:42px;border-radius:8px;font-size:22px;cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,.3);}

/* ─── 主內容 ─── */
.main{margin-left:var(--sbW);min-height:100vh;}
.main-inner{max-width:1100px;margin:0 auto;padding:0 24px 60px;}

/* Hero */
.site-hero{
  background:var(--headGrad);color:#f5e8c8;
  padding:82px 36px 70px;text-align:center;position:relative;overflow:hidden;
}
.site-hero::before{
  content:"般若";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  font-size:300px;color:rgba(212,168,75,.04);
  font-weight:900;letter-spacing:32px;pointer-events:none;
  font-family:"Noto Serif TC",serif;
}
.hero-title{
  font-family:"Noto Serif TC",serif;font-weight:900;font-size:56px;
  letter-spacing:10px;color:var(--goldL);margin-bottom:18px;
  text-shadow:0 2px 12px rgba(0,0,0,.4);position:relative;z-index:1;
}
.hero-meta{
  font-family:"Noto Sans TC",sans-serif;font-size:18px;letter-spacing:4px;
  color:#e8d8b0;margin-bottom:10px;opacity:.92;position:relative;z-index:1;
}
.hero-subtitle{
  font-size:20px;letter-spacing:6px;color:#e8d8b0;margin-bottom:14px;
  position:relative;z-index:1;
}
.hero-divider{width:90px;height:1px;background:var(--gold);
  margin:18px auto;opacity:.6;position:relative;z-index:1;}
.hero-sub{font-size:18px;color:#e8d8b0;letter-spacing:2px;
  margin-bottom:6px;position:relative;z-index:1;}
.hero-range{font-size:17px;color:#cdb98b;letter-spacing:2px;
  font-style:italic;position:relative;z-index:1;margin-top:6px;}
.hero-en{font-family:Georgia,serif;font-size:14px;color:#b9a677;
  letter-spacing:3px;margin-top:14px;opacity:.75;position:relative;z-index:1;}

/* Preface */
.preface{max-width:980px;margin:0 auto;padding:42px 24px 22px;
  border-bottom:1px solid var(--border-light);}
.preface h2{font-family:"Noto Serif TC",serif;font-size:30px;
  text-align:center;color:var(--accent);letter-spacing:8px;margin-bottom:26px;}
.preface p{margin:0 0 16px;font-size:19px;line-height:2.1;
  color:var(--text2);text-align:justify;}
.preface p strong{color:var(--accent-red);font-weight:700;}
.preface p em{color:var(--gold);font-style:normal;font-weight:600;}

/* 總目錄 */
.toc-section{max-width:1100px;margin:24px auto 24px;
  padding:36px 24px 20px;text-align:center;}
.toc-title{font-family:"Noto Serif TC",serif;font-size:34px;
  color:var(--accent);letter-spacing:8px;margin-bottom:10px;}
.toc-desc{font-size:17px;color:var(--text-muted);letter-spacing:2px;margin-bottom:28px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:20px;text-align:left;}
.toc-card{background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:22px 24px;
  display:flex;align-items:center;gap:18px;cursor:pointer;
  transition:all .25s;text-decoration:none;color:var(--text);
  box-shadow:0 2px 6px rgba(91,58,41,.05);}
.toc-card:hover{transform:translateY(-2px);

.toc-num{width:48px;height:48px;border-radius:50%;
  background:var(--gold);color:#fffdf7;
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif TC",serif;font-size:21px;font-weight:700;
  flex-shrink:0;letter-spacing:0;}
.toc-name{font-size:19.5px;font-weight:600;color:var(--accent);
  line-height:1.6;}
.toc-sub{font-size:14.5px;color:var(--text-muted);
  margin-top:4px;letter-spacing:1px;font-weight:400;}

/* 章節 */
.chapter{margin-top:32px;}
.ch-head{
  background:var(--headGrad);color:#f5e8c8;
  padding:46px 28px 40px;text-align:center;position:relative;overflow:hidden;
  border-radius:12px 12px 0 0;margin:0 14px;
}
.ch-head::after{

  width:80px;height:1px;background:var(--gold);
  transform:translateX(-50%);opacity:.7;
}

  position:relative;z-index:1;}
.ch-name{font-family:"Noto Serif TC",serif;font-weight:700;

  margin-bottom:12px;position:relative;z-index:1;}
.ch-sub{font-size:17px;color:#e8d8b0;letter-spacing:2px;
  opacity:.88;position:relative;z-index:1;}

.ch-body{
  background:var(--bg);padding:34px 14px 24px;
  border:1px solid var(--border);border-top:0;
  border-radius:0 0 12px 12px;margin:0 14px 0;
}

.bridge{
  background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:20px 26px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);
}

}

  margin-bottom:12px;

.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0 0 10px;color:var(--text2);
  line-height:2.1;font-size:18.5px;}
.bridge p:last-child{margin-bottom:0;}
.bridge p strong{color:var(--accent-red);font-weight:700;}
.bridge p em{color:var(--gold);font-style:normal;font-weight:600;}

.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;min-height:180px;}

.next-link{display:inline-block;margin-top:18px;padding:10px 22px;
  background:var(--accent);color:#fffdf7;
  border-radius:24px;font-size:17px;letter-spacing:3px;
  font-family:"Noto Sans TC",sans-serif;}
.next-link:hover{background:var(--gold);color:#fffdf7;}

.read-progress{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  z-index:120; background:rgba(30,26,20,.92); color:var(--gold);
  padding:9px 24px; border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px; letter-spacing:2px;
  display:flex; align-items:center; gap:12px;
  pointer-events:none; user-select:none;
  backdrop-filter:blur(6px);
  transition:opacity .45s ease, transform .45s ease;
}
.read-progress.hide-near-end{
  opacity:0;
  transform:translateX(-50%) translateY(28px);
}
.read-progress .rp-bar{width:148px;height:4px;
  background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;
  text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.85;
  letter-spacing:4px;color:var(--goldL);}

/* 回頂按鈕 */
#backTop{position:fixed;right:24px;bottom:78px;
  width:44px;height:44px;border-radius:50%;background:var(--accent);
  color:#fffdf7;border:0;font-size:20px;cursor:pointer;
  display:none;z-index:115;box-shadow:0 4px 14px rgba(0,0,0,.25);}
#backTop:hover{background:var(--gold);}
#backTop.show{display:block;}

/* 頁尾 */
.site-footer{background:#1e1a14;color:#d4c4a8;
  padding:38px 24px;text-align:center;margin-top:46px;}
.site-footer p{font-size:15px;letter-spacing:2px;margin:0 0 4px;}

/* 響應式 */
@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.show{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;}
  .hero-title{font-size:42px;letter-spacing:6px;}
  .ch-name{font-size:26px;letter-spacing:4px;}
  .ch-head{padding:34px 18px 28px;margin:0 6px;}
  .ch-body{padding:24px 6px 18px;margin:0 6px;}
  .toc-grid{grid-template-columns:1fr;}
  .bridge{padding:16px 18px;}
  .bridge p{font-size:17px;line-height:1.95;}
}

<script>
// 漢堡選單
var sbToggle=document.getElementById('sbToggle');
var sb=document.getElementById('sb');
if(sbToggle){
  sbToggle.addEventListener('click',function(){sb.classList.toggle('show');});
}
// 卷名回頂
var sbBrand=document.getElementById('sbBrand');
if(sbBrand){
  sbBrand.addEventListener('click',function(e){
    e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});
    if(sb) sb.classList.remove('show');
  });
}
// 回頂按鈕
var backTop=document.getElementById('backTop');
window.addEventListener('scroll',function(){
  if(window.scrollY>600) backTop.classList.add('show');
  else backTop.classList.remove('show');
});
backTop.addEventListener('click',function(){
  window.scrollTo({top:0,behavior:'smooth'});
});

// 進度條
var rpFill=document.getElementById('rpFill');
var rpPct=document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight - window.innerHeight;
  var pct=sh>0 ? Math.min(100, Math.max(0, window.scrollY/sh*100)) : 0;
  if(rpFill) rpFill.style.width=pct+'%';
  if(rpPct) rpPct.textContent=Math.round(pct)+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});
updateProgress();

// 進度條接近頁尾淡出
(function(){
  var cap=document.getElementById('readProgress');
  if(!cap) return;
  function setHide(on){cap.classList.toggle('hide-near-end', !!on);}
  var targets=[];
  var f1=document.querySelector('[data-wy-notice="v2"]');
  if(f1) targets.push(f1);
  var f2=document.querySelector('.site-footer');
  if(f2) targets.push(f2);
  if(!targets.length) return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      var any=entries.some(function(e){return e.isIntersecting;});
      setHide(any);
    },{root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});
    targets.forEach(function(t){io.observe(t);});
  }
})();

// 側欄高亮
var sbItems=document.querySelectorAll('.sb-item');
function updateActive(){
  var chs=document.querySelectorAll('.chapter');
  var threshold=window.innerHeight*0.35;
  var activeIdx=-1;
  chs.forEach(function(c,i){
    var r=c.getBoundingClientRect();
    if(r.top<threshold) activeIdx=i;
  });
  sbItems.forEach(function(it,i){
    it.classList.toggle('active', i===activeIdx);
  });
}
window.addEventListener('scroll',updateActive,{passive:true});
updateActive();

// iframe 自動高度（body.scrollHeight 法，避免長空白）
function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.body) return;
    d.body.style.minHeight='0';d.body.style.height='auto';
    if(d.documentElement){
      d.documentElement.style.minHeight='0';
      d.documentElement.style.height='auto';
    }
    var h=d.body.scrollHeight;
    if(h>100){
      f.style.height=h+'px';
      f.style.minHeight='0';
    }
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function') updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){
    tries++;
    resizeFrame(f);
    if(tries<30) setTimeout(tick,200);
  }
  if(f.contentDocument && f.contentDocument.readyState==='complete') tick();
  else f.addEventListener('load',tick);
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize',function(){
  clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);
});
var _rt=0,_riv=setInterval(function(){
  _rt++;resizeAllFrames();
  if(_rt>50) clearInterval(_riv);
},300);

// 錨點點擊防錯跳
document.addEventListener('click',function(e){
  var a=e.target;
  while(a&&a.tagName!=='A') a=a.parentElement;
  if(!a) return;
  var h=a.getAttribute('href');
  if(!h||h.charAt(0)!=='#'||h.length<2) return;
  var id=h.substring(1);
  var el=document.getElementById(id);
  if(!el) return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect=el.getBoundingClientRect();
    var y=window.scrollY+rect.top-20;
    window.scrollTo({top:y,behavior:'smooth'});
  },60);
},true);

// 防複製
(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart','mousedown'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(ev==='mousedown' && e.button!==2) return;
      blk(e);
    },true);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
    if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}
  },true);
  setInterval(function(){
    if(window.getSelection) try{window.getSelection().removeAllRanges();}catch(e){}
  },300);
})();
</script>

<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-49-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
