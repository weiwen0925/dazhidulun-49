<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>大智度論 · 第四十九卷 · 釋發趣品第二十 · 初地至六地 彙整</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;
  --accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;
  --gold:#b8860b;--goldL:#d4a84b;--gold-light:#C9A84C;
  --border:#d4c4a8;--border-light:#EDE8E0;--card:#fffdf7;
  --verseBg:#f0e8d8;--verseBd:#c4956a;
  --sbW:104px;--sbBg:#1e1a14;--sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--text);
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  font-size:20px;line-height:1.85;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
img{-webkit-user-drag:none;pointer-events:none;}

/* ===== Sidebar ===== */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-head{position:sticky;top:0;width:100%;z-index:5;
  background:var(--sbBg);padding:14px 6px 10px;
  border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand{display:block;text-align:center;text-decoration:none;cursor:pointer;
  font-family:"Noto Sans TC",sans-serif;line-height:1.5;
  transition:color .25s;}
.sb-brand .l1{display:block;font-size:11px;letter-spacing:1.5px;color:var(--gold);opacity:.82;}
.sb-brand .l2{display:block;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--goldL);margin-top:2px;}
.sb-brand:hover .l2{color:#f0d27a;}
.sb-quick{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:9px;}
.sb-qbtn{display:block;width:78px;text-align:center;cursor:pointer;text-decoration:none;
  font-family:"Noto Sans TC",sans-serif;font-size:11.5px;letter-spacing:1px;
  color:var(--goldL);background:rgba(184,134,11,.12);
  border:1px solid rgba(184,134,11,.45);border-radius:11px;padding:3px 0;
  transition:background .2s,color .2s;}
.sb-qbtn:hover{background:rgba(184,134,11,.28);color:#f3d784;}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding-top:8px;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  width:100%;padding:5px 4px;text-decoration:none;color:var(--sbText);
  cursor:pointer;border-radius:8px;transition:background .2s;}
.sb-item:hover{background:rgba(184,134,11,.14);}
.sb-item.active{background:rgba(184,134,11,.22);box-shadow:inset 0 0 0 1px rgba(184,134,11,.4);}
.sb-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:600;
  background:rgba(212,196,168,.12);border:1px solid rgba(212,196,168,.3);color:var(--goldL);
  transition:background .2s,color .2s;}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;border-color:var(--goldL);
  box-shadow:0 0 12px rgba(184,134,11,.6);}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;letter-spacing:.3px;
  color:var(--sbText);opacity:.86;text-align:center;line-height:1.25;}

/* ===== Main ===== */
.main{margin-left:var(--sbW);}
.wrap{max-width:920px;margin:0 auto;padding:0 26px;}

/* ===== Hero ===== */
.site-hero{position:relative;overflow:hidden;
  background:var(--headGrad);color:#f3ead4;text-align:center;
  padding:78px 26px 64px;}
.site-hero::before{content:"空";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:420px;color:rgba(212,168,75,.045);
  font-weight:900;pointer-events:none;line-height:1;}
.hero-tag{position:relative;font-family:"Noto Sans TC",sans-serif;font-size:14px;
  letter-spacing:7px;color:var(--goldL);opacity:.9;margin-bottom:18px;}
.hero-title{position:relative;font-size:56px;font-weight:900;letter-spacing:5px;color:#f0d68a;
  text-shadow:0 2px 18px rgba(0,0,0,.4);margin-bottom:10px;}
.hero-sub{position:relative;font-size:21px;font-weight:600;color:#e6d5a8;letter-spacing:2px;margin-bottom:22px;}
.hero-meta{position:relative;font-family:"Noto Sans TC",sans-serif;font-size:15px;
  color:#cdbb92;letter-spacing:1.5px;line-height:2;}
.hero-en{position:relative;font-family:Georgia,serif;font-style:italic;font-size:15px;
  color:rgba(212,168,75,.7);margin-top:14px;letter-spacing:1px;}

/* hero notice card */
.hero-notice{position:relative;max-width:680px;margin:30px auto 0;
  background:rgba(247,243,236,.08);border:1px solid rgba(212,168,75,.3);
  border-radius:12px;padding:16px 26px;font-family:"Noto Sans TC",sans-serif;
  font-size:13.5px;line-height:1.9;color:#d8c79c;letter-spacing:.6px;}

/* ===== Preface ===== */
.preface{background:linear-gradient(180deg,#fbf7ef,#f5efe2);border-bottom:1px solid var(--border);
  padding:48px 0;}
.preface-title{text-align:center;font-size:30px;font-weight:700;color:var(--accent);
  letter-spacing:3px;margin-bottom:8px;}
.preface-deco{text-align:center;color:var(--gold);font-size:18px;margin-bottom:26px;letter-spacing:6px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin-bottom:16px;text-align:justify;}
.preface p strong{color:var(--accent-red);font-weight:700;}

/* ===== TOC ===== */
.toc-section{padding:54px 0 40px;background:var(--bg);}
.toc-title{text-align:center;font-size:34px;font-weight:700;color:var(--accent);letter-spacing:10px;margin-bottom:8px;}
.toc-desc{text-align:center;font-family:"Noto Sans TC",sans-serif;font-size:15px;
  color:var(--text-muted);letter-spacing:2px;margin-bottom:34px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;max-width:1100px;margin:0 auto;padding:0 26px;}
.toc-card{display:flex;align-items:flex-start;gap:16px;text-decoration:none;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;box-shadow:0 1px 4px rgba(91,58,41,.06);
  transition:transform .18s,box-shadow .18s,border-color .18s;}
.toc-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(91,58,41,.13);border-color:var(--accentL);}
.toc-num{flex:0 0 auto;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;
  font-family:"Noto Sans TC",sans-serif;font-size:18px;font-weight:700;
  box-shadow:0 2px 8px rgba(184,134,11,.35);}
.toc-body{flex:1;}
.toc-name{font-size:19px;font-weight:700;color:var(--text);line-height:1.5;margin-bottom:4px;}
.toc-cap{font-family:"Noto Sans TC",sans-serif;font-size:13px;color:var(--text-muted);line-height:1.6;letter-spacing:.3px;}

/* ===== Chapters ===== */
.chapter{padding-top:8px;}
.ch-head{position:relative;overflow:hidden;background:var(--headGrad);color:#f3ead4;
  text-align:center;padding:50px 26px 44px;margin-top:30px;}
.ch-head::after{content:"";position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
  width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--goldL),transparent);}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:18px;letter-spacing:5px;color:var(--goldL);opacity:.9;margin-bottom:14px;}
.ch-name{font-size:34px;font-weight:900;letter-spacing:3px;color:#f0d68a;text-shadow:0 2px 14px rgba(0,0,0,.35);}
.ch-sub{font-family:"Noto Sans TC",sans-serif;font-size:16px;color:#cdbb92;letter-spacing:1.5px;margin-top:14px;line-height:1.8;}
.ch-body{padding:40px 0 10px;}

/* headings */
h2{font-size:30px;font-weight:700;color:var(--accent);margin:34px 0 16px;
  padding:8px 0 8px 20px;border-left:4px solid var(--gold);
  background:linear-gradient(90deg,rgba(184,134,11,.10),transparent);letter-spacing:1px;}
h3{font-size:23.5px;font-weight:700;color:var(--text);margin:26px 0 12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);letter-spacing:.5px;}
h4{font-size:20px;font-weight:700;color:var(--text2);margin:18px 0 8px;}
h5{font-size:18.5px;font-weight:700;color:var(--gold);margin:12px 0 6px;}
p{font-size:20px;line-height:1.9;margin-bottom:14px;text-align:justify;color:var(--text);}
.lead{font-size:20px;color:var(--text2);}
strong,b{color:var(--accent-red);font-weight:700;}
em{font-style:normal;color:var(--accent);font-weight:600;}

/* classical text */
.classical{background:#FFFDF5;border:1px solid #E8E0D0;border-radius:10px;
  padding:20px 26px 18px;margin:18px 0;line-height:2;position:relative;}
.classical .text-label{display:inline-block;background:#3d3225;color:#f0d68a;
  font-family:"Noto Sans TC",sans-serif;font-size:13px;letter-spacing:2px;
  padding:3px 14px;border-radius:6px;margin-bottom:12px;}
.classical p{font-size:19px;line-height:2.05;color:#33291a;margin-bottom:10px;}
.classical p:last-child{margin-bottom:0;}
.classical.lun{background:#f7f4ec;border-color:#ddd0b6;}
.classical.lun .text-label{background:#5a4326;}

/* verse */
.verse{background:var(--verseBg);border-left:4px solid var(--verseBd);border-radius:0 8px 8px 0;
  padding:16px 26px;margin:18px 0;line-height:2;text-align:center;font-size:21px;color:#4a3b22;
  white-space:normal;}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:18px 24px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card.insight{border-left:5px solid var(--gold);background:linear-gradient(135deg,#fffdf5,#f7efdc);}
.card.note{border-left:5px solid var(--accentL);}
.card-title{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:8px;
  font-family:"Noto Sans TC",sans-serif;letter-spacing:1px;}
.card p{font-size:19px;margin-bottom:8px;}
.card p:last-child{margin-bottom:0;}

/* bridges */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);
  border-left:5px solid var(--gold);border-radius:10px;padding:18px 26px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:34px;margin-bottom:8px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:12px;
  background:var(--gold);color:#fff;padding:3px 14px;border-radius:12px;letter-spacing:2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2;font-size:18px;}
.bridge p+p{margin-top:10px;}

/* QA */
.qa{margin:16px 0;}
.qa .q{background:rgba(74,122,156,.08);border-left:3px solid #4a7a9c;
  padding:10px 18px;border-radius:0 6px 6px 0;margin-bottom:8px;color:#2c4a60;font-weight:600;}
.qa .a{padding:6px 18px;border-left:3px solid var(--accentL);color:var(--text);}

/* grids */
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0;}
.col-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;text-align:center;}
.col-card .col-title{font-size:19px;font-weight:700;color:var(--accent);margin-bottom:8px;}
.col-card p{font-size:16.5px;text-align:left;line-height:1.8;}
.four-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:18px 0;}
.four-grid .cell{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.four-grid .cell h5{margin-top:0;}
.four-grid .cell p{font-size:16.5px;line-height:1.75;}

/* tables */
.dt-table{width:100%;border-collapse:collapse;margin:18px 0;font-size:17px;
  background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.dt-table th{background:#3d3225;color:#f0d68a;font-family:"Noto Sans TC",sans-serif;
  font-weight:600;padding:12px 16px;letter-spacing:1px;text-align:left;font-size:16px;}
.dt-table td{padding:11px 16px;border-bottom:1px solid var(--border-light);vertical-align:top;line-height:1.7;}
.dt-table tr:last-child td{border-bottom:none;}
.dt-table tr:nth-child(even) td{background:rgba(184,134,11,.035);}
.dt-table td strong{color:var(--accent);}

/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:20px 0;}
.flow-box{background:var(--card);border:1.5px solid var(--accentL);border-radius:10px;
  padding:12px 18px;text-align:center;font-size:16.5px;min-width:120px;font-family:"Noto Sans TC",sans-serif;}
.flow-box small{display:block;color:var(--text-muted);font-size:13px;margin-top:4px;}
.flow-arrow{color:var(--gold);font-size:26px;font-weight:700;}

/* figures (SVG) */
.fig{margin:26px 0;}
.fig-frame{background:#fffdf5;border:1px solid var(--border);border-radius:12px;
  padding:24px 18px;box-shadow:0 2px 10px rgba(91,58,41,.05);}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto;}
.fig svg text{font-family:"Noto Sans TC","Noto Serif TC",sans-serif;}
.fig-cap{font-family:"Noto Sans TC",sans-serif;font-size:13px;color:var(--text-muted);
  letter-spacing:1.5px;text-align:center;margin-top:14px;line-height:1.6;}

/* next link */
.next-link{display:inline-block;margin:8px 0 0;font-family:"Noto Sans TC",sans-serif;
  font-size:16px;color:var(--accent);text-decoration:none;letter-spacing:1px;
  border-bottom:1px dashed var(--accentL);padding-bottom:2px;transition:color .2s;}
.next-link:hover{color:var(--gold);}

hr.sep{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:28px 0;}

/* footer */
.site-footer{background:#1e1a14;color:#cdbb92;text-align:center;padding:46px 26px;margin-top:50px;}
.ft-title{font-size:20px;color:var(--goldL);letter-spacing:3px;margin-bottom:16px;font-weight:700;}
.site-footer .ft-verse{font-size:17px;line-height:2.1;color:#d8c79c;max-width:560px;margin:0 auto 18px;}
.site-footer p{font-family:"Noto Sans TC",sans-serif;font-size:13.5px;color:#9c8c6f;letter-spacing:1px;line-height:1.9;}

/* read progress */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;
  background:rgba(30,26,20,.92);color:var(--gold);padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;
  backdrop-filter:blur(6px);transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-label{font-size:12px;opacity:.85;letter-spacing:4px;color:var(--goldL);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}

/* back to top */
#backTop{position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:22px;cursor:pointer;z-index:115;
  display:none;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.3);
  transition:background .2s,transform .2s;}
#backTop:hover{background:var(--gold);transform:translateY(-3px);}

/* hamburger */
#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:130;
  width:44px;height:44px;border-radius:10px;background:rgba(30,26,20,.92);color:var(--goldL);
  border:1px solid rgba(184,134,11,.4);font-size:20px;cursor:pointer;}

/* responsive */
@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;width:200px;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;}
  .sb-item{flex-direction:row;justify-content:flex-start;gap:10px;padding-left:14px;}
  .sb-label{font-size:14px;}
  .hero-title{font-size:40px;}
  .three-col{grid-template-columns:1fr;}
  .four-grid{grid-template-columns:1fr;}
  .ch-name{font-size:27px;}
}
@media(max-width:600px){
  body{font-size:17.5px;}
  .hero-title{font-size:32px;}
  h2{font-size:24px;}
}

/* ===== iframe 章框（多品合併）===== */
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border,#d4c4a8);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);margin:0 0 8px;min-height:200px;}
.next-link{display:inline-block;margin:18px 0 4px;font-family:"Noto Sans TC",sans-serif;
  font-size:17px;color:var(--accent,#8b5e3c);text-decoration:none;border-bottom:1px dashed var(--accentL,#c4956a);padding-bottom:2px;}
.next-link:hover{color:var(--gold,#b8860b);}
</style>

<script>
(function(){
  var sb=document.getElementById('sb'),tog=document.getElementById('sbToggle');
  if(tog)tog.addEventListener('click',function(){sb.classList.toggle('open');});
  var brand=document.getElementById('sbBrand');
  if(brand)brand.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});
  document.querySelectorAll('.sb-item,.sb-qbtn').forEach(function(a){
    a.addEventListener('click',function(){if(window.innerWidth<=900)sb.classList.remove('open');});});

  var rpFill=document.getElementById('rpFill'),rpPct=document.getElementById('rpPct');
  function updateProgress(){var sh=document.documentElement.scrollHeight-window.innerHeight;
    var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
    if(rpFill)rpFill.style.width=pct+'%';if(rpPct)rpPct.textContent=Math.round(pct)+'%';}
  window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();

  (function(){var cap=document.getElementById('readProgress');if(!cap)return;
    var ts=[];var a=document.querySelector('[data-wy-notice="v2"]');if(a)ts.push(a);
    var b=document.querySelector('.site-footer');if(b)ts.push(b);if(!ts.length)return;
    if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){
      cap.classList.toggle('hide-near-end',es.some(function(e){return e.isIntersecting;}));
    },{root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});ts.forEach(function(t){io.observe(t);});}})();

  var bt=document.getElementById('backTop');
  if(bt){window.addEventListener('scroll',function(){bt.style.display=window.scrollY>600?'flex':'none';},{passive:true});
    bt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});}

  var items=Array.prototype.slice.call(document.querySelectorAll('.sb-item'));
  var chaps=items.map(function(it){return document.getElementById('chapter-'+it.getAttribute('data-ch'));});
  function highlight(){var idx=-1;for(var i=0;i<chaps.length;i++){
    if(chaps[i]&&chaps[i].getBoundingClientRect().top<window.innerHeight*0.35)idx=i;}
    items.forEach(function(it,i){it.classList.toggle('active',i===idx);});
    if(idx>=0){var act=items[idx],r=act.getBoundingClientRect();
      if(r.top<70||r.bottom>window.innerHeight-20)act.scrollIntoView({block:'center'});}}
  window.addEventListener('scroll',highlight,{passive:true});highlight();

  // iframe 自動高度
  function resizeFrame(f){try{var d=f.contentDocument||f.contentWindow.document;if(!d||!d.body)return;
    d.body.style.minHeight='0';d.body.style.height='auto';
    if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}
    var h=d.body.scrollHeight;if(h>100){f.style.height=h+'px';f.style.minHeight='0';}}catch(e){}}
  function resizeAll(){document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
    if(typeof updateProgress==='function')updateProgress();}
  function setupFrame(f){var t=0;function tick(){t++;resizeFrame(f);if(t<30)setTimeout(tick,200);}
    if(f.contentDocument&&f.contentDocument.readyState==='complete')tick();else f.addEventListener('load',tick);}
  window.setupFrame=setupFrame;window.resizeAllFrames=resizeAll;
  document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
  var rzT;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAll,200);});
  document.addEventListener('click',function(e){var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;
    if(!a)return;var h=a.getAttribute('href');if(!h||h.charAt(0)!=='#'||h.length<2)return;
    var el=document.getElementById(h.substring(1));if(!el)return;e.preventDefault();resizeAll();
    setTimeout(function(){resizeAll();var rect=el.getBoundingClientRect();
      window.scrollTo({top:window.scrollY+rect.top-20,behavior:'smooth'});},60);},true);
  var _rt=0,_riv=setInterval(function(){_rt++;resizeAll();if(_rt>50)clearInterval(_riv);},300);

  // anti-copy
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){document.addEventListener(ev,blk,true);});
  document.addEventListener('keydown',function(e){var k=e.key;
    if(e.ctrlKey&&'cCaAsSpPuUxX'.indexOf(k)>=0)blk(e);if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&'iIjJcCkK'.indexOf(k)>=0)blk(e);},true);
})();
</script>

<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-49-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
